<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Vault — Local encrypted password manager with optional hardware keypad gating.">
    <title>The Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- Header                                                         -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <header id="app-header">
        <h1>🔒 The Vault</h1>
        <div id="status-indicator" class="status locked">LOCKED</div>
    </header>

    <main id="app-main">

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- Section 1: Initialization                                  -->
        <!-- ═══════════════════════════════════════════════════════════ -->
        <section id="init-section" class="panel">
            <h2>Initialize Vault</h2>
            <form id="init-form">
                <div class="form-group">
                    <label for="init-username">Username</label>
                    <input type="text" id="init-username" required placeholder="e.g. kaiden">
                </div>
                <div class="form-group">
                    <label for="init-display-name">Display Name</label>
                    <input type="text" id="init-display-name" required placeholder="e.g. Kaiden Bell">
                </div>
                <div class="form-group">
                    <label for="init-vault-name">Vault Name</label>
                    <input type="text" id="init-vault-name" required placeholder="e.g. My Vault">
                </div>
                <div class="form-group">
                    <label for="init-passphrase">Passphrase</label>
                    <input type="password" id="init-passphrase" required placeholder="Strong passphrase...">
                </div>
                <div class="form-group">
                    <label for="init-keypad-pin">Keypad PIN (optional, 6 digits)</label>
                    <input type="text" id="init-keypad-pin" maxlength="6" pattern="\d{6}" placeholder="e.g. 122004">
                </div>
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="init-hardware-gate">
                        Require hardware keypad gate
                    </label>
                </div>
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="init-software-only" checked>
                        Allow software-only unlock
                    </label>
                </div>
                <button type="submit" id="init-submit-btn" class="btn btn-primary">Create Vault</button>
            </form>
            <div id="init-message" class="message" role="alert"></div>
        </section>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- Section 2: Unlock                                          -->
        <!-- ═══════════════════════════════════════════════════════════ -->
        <section id="unlock-section" class="panel hidden">
            <h2>Unlock Vault</h2>

            <div id="hardware-gate-status" class="info-box">
                <p>Hardware gate status: <span id="gate-status-text">Unknown</span></p>
                <p>Passphrase window: <span id="window-status-text">Inactive</span></p>
            </div>

            <form id="unlock-form">
                <div class="form-group">
                    <label for="unlock-vault-id">Vault ID</label>
                    <input type="number" id="unlock-vault-id" required value="1" min="1">
                </div>
                <div class="form-group">
                    <label for="unlock-passphrase">Passphrase</label>
                    <input type="password" id="unlock-passphrase" required placeholder="Enter passphrase...">
                </div>
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="unlock-software-mode">
                        Software-only mode
                    </label>
                </div>
                <button type="submit" id="unlock-submit-btn" class="btn btn-primary">Unlock</button>
            </form>
            <div id="unlock-message" class="message" role="alert"></div>
        </section>

        <!-- ═══════════════════════════════════════════════════════════ -->
        <!-- Section 3: Dashboard                                       -->
        <!-- ═══════════════════════════════════════════════════════════ -->
        <section id="dashboard-section" class="panel hidden">
            <div class="dashboard-header">
                <h2>Vault Dashboard</h2>
                <button id="lock-btn" class="btn btn-danger">🔒 Lock Vault</button>
            </div>

            <!-- Search -->
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search credentials...">
                <button id="search-btn" class="btn btn-secondary">Search</button>
            </div>

            <!-- Credential List -->
            <div id="entries-container">
                <table id="entries-table">
                    <thead>
                        <tr>
                            <th>Site</th>
                            <th>Username</th>
                            <th>Password</th>
                            <th>Last Rotated</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="entries-tbody">
                        <!-- Entries rendered by JS -->
                    </tbody>
                </table>
                <p id="no-entries-msg" class="hidden">No credentials stored yet.</p>
            </div>

            <!-- Add Credential -->
            <div class="add-credential-section">
                <h3>Add Credential</h3>
                <form id="add-entry-form">
                    <div class="form-row">
                        <input type="text" id="add-site" required placeholder="Site (e.g. github.com)">
                        <input type="text" id="add-username" required placeholder="Username">
                        <input type="password" id="add-password" required placeholder="Password">
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>

            <!-- Password Tools -->
            <div class="password-tools">
                <h3>Password Tools</h3>
                <div class="tool-row">
                    <button id="generate-password-btn" class="btn btn-secondary">Generate Password</button>
                    <input type="text" id="generated-password-output" readonly placeholder="Generated password appears here...">
                </div>
                <div class="tool-row">
                    <input type="password" id="strength-check-input" placeholder="Check password strength...">
                    <button id="check-strength-btn" class="btn btn-secondary">Check</button>
                    <span id="strength-result"></span>
                </div>
            </div>

            <div id="dashboard-message" class="message" role="alert"></div>
        </section>

    </main>

    <footer>
        <p>The Vault &mdash; Local Security Project</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
